{% load humanize %}{% if o.customer_id %}{# 카톡 상담 카드 (단계 1a-2) — 주문 없음, 표시·향후 우클릭만 #}
<div class="kanban-card kakao-card" data-kakao-id="{{ o.customer_id }}" data-kakao-name="{{ o.display_name|escape }}" title="{{ o.display_name }} (카톡){% if o.unread_count %} · 안읽음 {{ o.unread_count }}{% endif %}"><span class="kc-name">{{ o.display_name|truncatechars:3 }}</span>{% if o.unread_count %}<span class="kc-unread">{{ o.unread_count }}</span>{% endif %}</div>
{% else %}{# 자사몰 주문 카드 #}
<div class="kanban-card{% if o.is_urgent %} urgent{% endif %}" draggable="true" data-order-id="{{ o.id }}" data-customer-name="{{ o.customer_name|escape }}" data-shipping-address="{{ o.shipping_address|escape }}" data-customer-phone="{{ o.customer_phone|escape }}" data-deposit-name="{{ o.deposit_name|escape }}" data-is-urgent="{{ o.is_urgent|yesno:'1,0' }}" title="{{ o.kakao_chat_name }}"><span class="kc-name">{{ o.kakao_chat_name|truncatechars:3 }}</span></div>
{% endif %}
